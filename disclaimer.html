<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disclaimer | Tangible Real Estate Agency</title><meta name="description" content=""><meta name="robots" content="noindex,follow"><meta name="theme-color" content="#050505"><link rel="canonical" href="https://www.panvelprojects.in/disclaimer">
<style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font:16px/1.7 system-ui,-apple-system,Segoe UI,sans-serif}header{padding:18px 20px;border-bottom:1px solid #e5c46b33}header a{color:#E5C46B;text-decoration:none;font-family:Georgia,serif;font-size:20px}main{max-width:780px;margin:0 auto;padding:32px 20px 24px}h1{font-family:Georgia,serif;color:#E5C46B;font-size:34px;margin:0 0 6px}h2{color:#E5C46B;font-size:15px;letter-spacing:.08em;margin:30px 0 6px}p{color:#ffffffd9;margin:12px 0}.u{color:#ffffff80;font-size:13px}footer{max-width:780px;margin:0 auto;padding:20px;border-top:1px solid #e5c46b33;color:#ffffffb3;font-size:14px}@media(max-width:600px){h1{font-size:27px}}</style></head>
<body><header><a href="/">Panvel Projects</a></header><main id="m"><p>Loading…</p></main><footer id="f"></footer>
<script>(function(){var KEY='disclaimer';function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
fetch('/api/data?key=legal').then(function(r){return r.json()}).then(function(j){var D=j&&j.data,a=(D&&D.agent)||{},m=document.getElementById('m'),p=D&&(D.pages||[]).find(function(x){return x.slug===KEY});
if(!p||!p.published){m.innerHTML='<h1>Page not available</h1><p>This page is not published yet.</p>';return}
document.title=p.seoT||(p.title+' | '+(a.name||'Tangible Real Estate Agency'));if(p.seoD)document.querySelector('meta[name=description]').setAttribute('content',p.seoD);document.querySelector('meta[name=robots]').setAttribute('content','index,follow');
var h='<h1>'+esc(p.title)+'</h1>'+(p.updated?'<p class="u">Last updated: '+new Date(p.updated).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})+'</p>':'');
p.body.split(/\n{2,}/).forEach(function(b){b=b.trim();if(!b)return;var up=b===b.toUpperCase()&&b.length<70&&/[A-Z]/.test(b);h+=up?'<h2>'+esc(b)+'</h2>':'<p>'+esc(b).replace(/\n/g,'<br>')+'</p>'});m.innerHTML=h;
document.getElementById('f').innerHTML=(a.name?'<b>'+esc(a.name)+'</b><br>':'')+(a.rera?'MahaRERA Agent Registration No.: '+esc(a.rera)+'<br>':'')+(a.website?esc(a.website)+'<br>':'')+(a.phone?esc(a.phone):'')}).catch(function(){document.getElementById('m').innerHTML='<h1>Unable to load</h1><p>Please try again later.</p>'})})();</script></body></html>
